name: env variable print

on:
  workflow_dispatch

env:
  APP_NAME: env-variable

jobs:
  variable-job:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging
    steps:
      - name: "print workflow, job and step env variables"
        run: echo "$APP_NAME $ENVIRONMENT $VERSION"
        env:
          VERSION: 1.0.0
