name: job-output
on: workflow_dispatch

jobs:
  job1:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.step1.outputs.date }}
    steps:
      - id: step1
        run: echo "date=$(date)" >> $GITHUB_OUTPUT
  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - env:
          OUTPUT1: ${{ needs.job1.outputs.date }}
        run: echo "$OUTPUT1"
