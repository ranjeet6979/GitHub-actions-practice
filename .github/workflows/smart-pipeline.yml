name: smart-pipeline
on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: lint-step
        run: echo "this is lint job"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: test-step
        run: echo "this is test job"

  summary:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      - name: summary-step
        run: echo "this is summary job and commit message was ${{  github.event.commits[0].message }}"
